name: Check chapters

on:
  schedule:
    - cron: "23 10,22 * * *"  # 10:23/22:23 UTC = ~6:23am/6:23pm New York (EDT), 5:23am/5:23pm in winter (EST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tracker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python tracker.py

      - name: Commit state and README if changed
        run: |
          if [ -n "$(git status --porcelain state.json README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add state.json README.md
            git commit -m "Update state"
            git push
          else
            echo "No state changes"
          fi
